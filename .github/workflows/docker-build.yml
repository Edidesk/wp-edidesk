name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  DOCKER_IMAGE: bartferr/wp-edidesk
  DOCKERFILE_PATH: ./Dockerfile

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract versions from Dockerfile
        id: versions
        run: |
          PHP_VERSION=$(grep 'ARG PHP_VERSION=' Dockerfile | cut -d= -f2)
          WP_VERSION=$(grep 'ARG WP_VERSION=' Dockerfile | cut -d= -f2)
          echo "php=$PHP_VERSION" >> $GITHUB_OUTPUT
          echo "wp=$WP_VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=wp${{ steps.versions.outputs.wp }}-php${{ steps.versions.outputs.php }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "WP ${{ steps.versions.outputs.wp }} · PHP ${{ steps.versions.outputs.php }}"
          body: |
            ## Imagem Docker
            ```
            docker pull bartferr/wp-edidesk:wp${{ steps.versions.outputs.wp }}-php${{ steps.versions.outputs.php }}
            ```

            ## Versões
            - **WordPress:** ${{ steps.versions.outputs.wp }}
            - **PHP:** ${{ steps.versions.outputs.php }}
          generate_release_notes: true
