; Configurações customizadas de PHP para WordPress - Edidesk

; Limites de Upload
; Reduzido de 256M como mitigação parcial para CVE-2026-109618
upload_max_filesize = 16M
post_max_size = 32M

; Limites de Memória
; memory_limit=-1 previne o OOM handler do PHP (CVE-2026-109618)
; Use limites de memória no container/cgroup para controle real
memory_limit = -1

; Tempo de Execução
max_execution_time = 300
max_input_time = 300

; Outras configurações úteis
max_input_vars = 5000
file_uploads = On

; Configurações de sessão
session.gc_maxlifetime = 3600
session.save_path = "/tmp"
; Mitiga CVE-2026-109619 (Stale Global State via upload progress tracking)
session.upload_progress.enabled = 0

; Logs de erros
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Timezone
date.timezone = America/Fortaleza

; OPcache para melhor performance
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
